{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ferretdb.fullname" . }}
  labels:
    {{- include "ferretdb.labels" . | nindent 4 }}
  {{- with .Values.externalSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ .Values.externalSecret.targetSecretName | default (printf "%s-pg-credentials" (include "ferretdb.fullname" .)) }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy | default "Retain" }}
  data:
    - secretKey: {{ .Values.externalSecret.secretKey | default "uri" }}
      remoteRef:
        key: {{ required "externalSecret.remoteRef.key is required" .Values.externalSecret.remoteRef.key }}
        {{- if .Values.externalSecret.remoteRef.property }}
        property: {{ .Values.externalSecret.remoteRef.property }}
        {{- end }}
        {{- if .Values.externalSecret.remoteRef.version }}
        version: {{ .Values.externalSecret.remoteRef.version | quote }}
        {{- end }}
{{- end }}
