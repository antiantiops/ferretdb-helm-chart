replicaCount: 1

image:
  repository: ghcr.io/ferretdb/ferretdb
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

ferretdb:
  postgresqlUrl: ""
  auth: true
  extraEnv: []

existingSecret:
  enabled: false
  name: ""
  key: "uri"

